---
name: CI
permissions:
  id-token: write # This is required for requesting the JWT from AWS.
  contents: read
  actions: read
  security-events: write
  pull-requests: write
on:
  pull_request:
    branches:
      - main

# Concurrency control to prevent multiple workflow runs from conflicting
# This is critical for Terraform to avoid state locking issues
concurrency:
  group: ci-${{ github.event.pull_request.number }}  # One run per PR
  cancel-in-progress: true  # Cancel previous runs when new commits are pushed

jobs:
  setup-infra:
    name: Setup Infrastructure
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: github-sessions

      - name: Terraform Init & Plan
        working-directory: ./infra-as-code
        run: ./tf-wrapper.sh init

      - name: Terraform Plan
        working-directory: ./infra-as-code
        run: ./tf-wrapper.sh plan